# Goldy-specific fixed version - preserves his purge positions/speeds/timings
# Compatible with his AFC config: poop_cmd: ZERO_G_BLOB_MACRO, wipe:false
# ======================================================
# SERVO ARM CONFIGURATION (Internal Use)
# ======================================================
[servo poop_arm]
pin: PG12
maximum_servo_angle: 180
minimum_pulse_width: 0.0010    # extend deploy side (0°)
maximum_pulse_width: 0.0025    # retract side (180°)
initial_angle: 180             # retracted/parked position

[delayed_gcode INIT_POOP_SERVO]
initial_duration: 1
gcode:
    M117 🟡 Initializing Poop Arm
    SET_SERVO SERVO=poop_arm ANGLE=180
    G4 P500
    SET_SERVO SERVO=poop_arm WIDTH=0
    M117 🔵 Poop Arm Ready



[gcode_macro POOP_DEPLOY]
description: Deploy poop arm to catch purge
gcode:
    SET_SERVO SERVO=poop_arm ANGLE=2
    M117 🟢 Poop Arm Deployed

[gcode_macro POOP_RETRACT]
description: Retract poop arm
gcode:
    M400
    SET_SERVO SERVO=poop_arm ANGLE=180
    G4 P200
    SET_SERVO SERVO=poop_arm WIDTH=0
    M117 🔵 Poop Arm Retracted





[gcode_macro ZERO_G_BLOB_MACRO]
description: Purge into servo poop bucket (adjustable, separate ramp for first vs later blobs)

# ================================
# === BLOB EXTRUSION SETTINGS ===
# ================================
variable_blob_size:            75    # How much filament to extrude per blob (mm)
variable_ramp_steps:           10      # Number of steps to gradually ramp extrusion speed
variable_ramp_start:           0.5    # Starting speed fraction for the very first blob (0 = slow, 1 = full)
variable_secondary_ramp_start: 0.025   # Starting speed fraction for later blobs
variable_ramp_end:             1.1     # End speed fraction (closer to 1 = faster)

# ================================
# === RETRACT & PRESSURE RELIEF ===
# ================================
variable_retract:              0.3       # Small retract after the last blob (mm)
variable_inter_blob_retract:   0.3       # Retract between blobs (mm)
variable_vent_time:            3500    # Pause after retract (ms)
variable_vent_fan:             45      # Fan % during vent pause

# ================================
# === FAN & COOLING CONTROL (percent 0–100) ===
# ================================
variable_settle_fan:           100     # Fan % while blob firms before kick
variable_settle_time:          3000    # Fan duration for settling (ms)
variable_harden_fan:           100     # Fan % for harden phase
variable_harden_time:          100     # Harden time (ms)
variable_blast_fan:            100     # Fan % for blast phase
variable_blast_time:           500     # Blast time (ms)
variable_fan_off_delay:        500     # Delay before turning off fan at purge start (ms)
variable_post_fanoff_delay:    500     # Extra delay after first blob (ms)

# ================================
# === POSITION & TIMING ===
# ================================
variable_purge_x:              267     # Purge X position
variable_purge_y:              377     # Purge Y position
variable_inter_blob_pause:     100     # Pause between blobs (ms)

# ================================
# === KICK MOVE CONTROL ===
# ================================
variable_kick_x:               277     # Kick X position
variable_kick_y:               377     # Kick Y position
variable_kick_speed:           300     # Kick move feedrate (mm/s)
variable_kick_accel:           15000   # Kick move acceleration (mm/s^2)

# ================================
# === GENERAL CONTROL ===
# ================================
variable_travel_speed:         500     # Travel speed (mm/s)
variable_purge_spd:            7.0    # Purge extrusion speed (mm/s)
variable_accel:                10000   # Accel override for macro moves (mm/s^2)
variable_verbose:              1       # Console output (0=off, 1=basic, 2=verbose)
variable_restore_position:     False    # Restore position after purge

gcode:
    #########################################################################
    # --- LOAD PARAMETERS ---
    #########################################################################
    {% set macro = printer['gcode_macro ZERO_G_BLOB_MACRO'] %}
    {% set blob_size   = params.BLOB_SIZE|default(macro.blob_size)|float %}
    {% set retract_mm  = params.RETRACT|default(macro.retract)|float %}
    {% set inter_retract = params.INTER_BLOB_RETRACT|default(macro.inter_blob_retract)|float %}
    {% set vent_time   = params.VENT_TIME|default(macro.vent_time)|int %}
    {% set vent_fan    = ((params.VENT_FAN|default(macro.vent_fan)|float) * 255 / 100)|round|int %}
    {% set settle_fan  = ((params.SETTLE_FAN|default(macro.settle_fan)|float) * 255 / 100)|round|int %}
    {% set settle_time = params.SETTLE_TIME|default(macro.settle_time)|int %}
    {% set harden_fan  = ((params.HARDEN_FAN|default(macro.harden_fan)|float) * 255 / 100)|round|int %}
    {% set harden_time = params.HARDEN_TIME|default(macro.harden_time)|int %}
    {% set blast_fan   = ((params.BLAST_FAN|default(macro.blast_fan)|float) * 255 / 100)|round|int %}
    {% set blast_time  = params.BLAST_TIME|default(macro.blast_time)|int %}
    {% set purge_x     = params.PURGE_X|default(macro.purge_x)|float %}
    {% set purge_y     = params.PURGE_Y|default(macro.purge_y)|float %}
    {% set ramp_steps  = params.RAMP_STEPS|default(macro.ramp_steps)|int %}
    {% set ramp_start  = params.RAMP_START|default(macro.ramp_start)|float %}
    {% set secondary_ramp_start = params.SECONDARY_RAMP_START|default(macro.secondary_ramp_start)|float %}
    {% set ramp_end    = params.RAMP_END|default(macro.ramp_end)|float %}
    {% set inter_blob_pause = params.INTER_BLOB_PAUSE|default(macro.inter_blob_pause)|int %}
    {% set fan_off_delay = params.FAN_OFF_DELAY|default(macro.fan_off_delay)|int %}
    {% set post_fanoff_delay = params.POST_FANOFF_DELAY|default(macro.post_fanoff_delay)|int %}
    {% set kick_x      = params.KICK_X|default(macro.kick_x)|float %}
    {% set kick_y      = params.KICK_Y|default(macro.kick_y)|float %}
    {% set kick_speed  = params.KICK_SPEED|default(macro.kick_speed)|float %}
    {% set travel_speed= params.TRAVEL_SPEED|default(macro.travel_speed)|float %}
    {% set purge_spd   = params.PURGE_SPD|default(macro.purge_spd)|float %}
    {% set accel       = params.ACCEL|default(macro.accel)|float %}
    {% set verbose     = params.VERBOSE|default(macro.verbose)|int %}
    {% set restore_position = params.RESTORE_POSITION|default(macro.restore_position)|lower == 'true' %}
    {% set chunk = (blob_size / ramp_steps)|float %}

    #########################################################################
    # --- SAFETY CHECK ---
    #########################################################################
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("ZeroG_Blob: Home XYZ before purging.")}
    {% endif %}
    {% if blob_size <= 0 or ramp_steps <= 0 %}
        {action_raise_error("ZeroG_Blob: BLOB_SIZE and RAMP_STEPS must be greater than zero.")}
    {% endif %}
    {% if purge_spd <= 0 or travel_speed <= 0 or kick_speed <= 0 or accel <= 0 %}
        {action_raise_error("ZeroG_Blob: Speeds and acceleration must be greater than zero.")}
    {% endif %}

    #########################################################################
    # --- PURGE LENGTH SETTINGS ---
    #########################################################################
    # AFC can call a custom poop macro with PURGE_LENGTH=0 on an initial load.
    # In that case use Goldy's normal 75 mm blob instead of doing no extrusion.
    {% if params.PURGE_LENGTH is defined %}
        {% set requested_from_afc = params.PURGE_LENGTH|float %}
        {% if requested_from_afc < 0 %}
            {action_raise_error("ZeroG_Blob: PURGE_LENGTH cannot be negative.")}
        {% endif %}
        {% if requested_from_afc > 0 %}
            {% set purge_length_req = requested_from_afc %}
            {% set mode = "AFC" %}
        {% else %}
            {% set purge_length_req = blob_size %}
            {% set mode = "AFC-default" %}
        {% endif %}
    {% else %}
        {% set purge_length_req = blob_size %}
        {% set mode = "manual" %}
    {% endif %}

    {% if purge_length_req > 0 and not printer[printer.toolhead.extruder].can_extrude %}
        {action_raise_error("ZeroG_Blob: Hotend is below min_extrude_temp; AFC must heat the nozzle before purge.")}
    {% endif %}

    {% set blob_count = (purge_length_req / blob_size)|round(0, 'ceil')|int %}
    {% if blob_count < 1 %}{% set blob_count = 1 %}{% endif %}
    {% set purge_len_total = blob_count * blob_size %}

    {% if verbose > 0 %}
        {% set msg = "🟢 ZeroG_Blob: Mode=" ~ mode ~ ", Requested=" ~ purge_length_req|string ~ "mm, Blobs=" ~ blob_count|string ~ ", Total=" ~ purge_len_total|string ~ "mm" %}
        RESPOND TYPE=command MSG="{msg}"
    {% endif %}

    #########################################################################
    # --- BACKUP CURRENT PRINTER STATE ---
    #########################################################################
    SAVE_GCODE_STATE NAME=_ZERO_G_BLOB_MACRO
    {% set backup_fan = printer.fan.speed|float %}
    {% set backup_feed = printer.gcode_move.speed_factor|float %}
    {% set backup_accel = printer.toolhead.max_accel|float %}
    M220 S100
    AFC_DISABLE_SKEW

    ; global modes + accel override (moved out of loop)
    M83
    G90
    SET_VELOCITY_LIMIT ACCEL={accel}

    #########################################################################
    # --- BLOB LOOP ---
    #########################################################################
    {% for n in range(blob_count) %}
        M106 S0
        {% if n == 0 %}
            {% set msg = "⏸ Fan off delay (first blob): " ~ fan_off_delay|string ~ "ms" %}
            RESPOND TYPE=command MSG="{msg}"
            G4 P{fan_off_delay}
        {% else %}
            {% set msg = "⏸ Fan off + post delay: " ~ (fan_off_delay + post_fanoff_delay)|string ~ "ms" %}
            RESPOND TYPE=command MSG="{msg}"
            G4 P{fan_off_delay + post_fanoff_delay}
        {% endif %}
        
        G92 E0
        G90
        G1 X{purge_x} Y{purge_y} F{(travel_speed*60)|int}
        M400

        {% if verbose > 1 %}
            {% set msg = "➡️ Starting blob " ~ (n+1)|string ~ "/" ~ blob_count|string %}
            RESPOND TYPE=command MSG="{msg}"
        {% endif %}

        POOP_DEPLOY
        G4 P500

        # Purge ramp
        G91
        {% if n == 0 %}
            {% set start_factor = ramp_start %}
        {% else %}
            {% set start_factor = secondary_ramp_start %}
        {% endif %}
        {% for i in range(ramp_steps) %}
            {% set factor = start_factor + ((ramp_end - start_factor) * ((i+1)/ramp_steps)) %}
            G1 E{chunk|round(2)} F{(purge_spd * factor * 60)|int}
        {% endfor %}
        G90

        # Retract + vent pause
        G91
        {% set retract_amt = (inter_retract if not loop.last else retract_mm) %}
        G1 E-{retract_amt} F1800
        {% set msg = "⏸ Vent delay after retract: " ~ vent_time|string ~ "ms" %}
        RESPOND TYPE=command MSG="{msg}"        
        {% if vent_time > 0 %}
            {% if vent_fan > 0 %}
                {% set vent_msg = "🌀 Vent fan: " ~ ((vent_fan/2.55)|int)|string ~ "%" %}
                RESPOND TYPE=command MSG="{vent_msg}"
                M106 S{vent_fan}
            {% endif %}
            G4 P{vent_time}
            {% if vent_fan > 0 %}
                M106 S0
            {% endif %}
        {% endif %}
        G90

        POOP_RETRACT_DANCE
        POOP_RETRACT_DANCE 
        POOP_RETRACT_DANCE
        POOP_RETRACT_DANCE
        #POOP_RETRACT
        
        # Blob firming
        M106 S{settle_fan}
        {% if settle_time > 0 %}
            {% set msg = "⏸ Settle delay: " ~ settle_time|string ~ "ms" %}
            RESPOND TYPE=command MSG="{msg}"
            G4 P{settle_time}
        {% else %}
            RESPOND TYPE=command MSG="⏭ Skipping settle (0ms)"
        {% endif %}
        M106 S0

        # Kick move (accel override already active globally)
        G1 X{kick_x} Y{kick_y} F{(kick_speed*60)|int}
        M400

        # Harden & blast
        M106 S{harden_fan}
        {% if harden_time > 0 %}
            {% set msg = "⏸ Harden delay: " ~ harden_time|string ~ "ms" %}
            RESPOND TYPE=command MSG="{msg}"
            G4 P{harden_time}
        {% else %}
            RESPOND TYPE=command MSG="⏭ Skipping harden (0ms)"
        {% endif %}
        M106 S{blast_fan}
        {% if blast_time > 0 %}
            {% set msg = "⏸ Blast delay: " ~ blast_time|string ~ "ms" %}
            RESPOND TYPE=command MSG="{msg}"
            G4 P{blast_time}
        {% else %}
            RESPOND TYPE=command MSG="⏭ Skipping blast (0ms)"
        {% endif %}

        {% set msg = "💩 Dropped blob " ~ (n+1)|string %}
        RESPOND TYPE=command MSG="{msg}"

        {% if not loop.last %}
            {% if inter_blob_pause > 0 %}
                {% set msg = "⏸ Inter-blob pause: " ~ inter_blob_pause|string ~ "ms" %}
                RESPOND TYPE=command MSG="{msg}"
                G4 P{inter_blob_pause}
            {% else %}
                RESPOND TYPE=command MSG="⏭ Skipping inter-blob pause (0ms)"
            {% endif %}
        {% endif %}
    {% endfor %}

    #########################################################################
    # --- FINAL CLEANUP ---
    #########################################################################
    M106 S{(backup_fan * 255)|round|int}
    M220 S{(backup_feed * 100)|round|int}

    # Goldy's AFC.cfg has wipe:false, and NOZZLE_WIPE1 does not exist on this printer.
    # If he later enables AFC wiping, AFC can call AFC_BRUSH separately.

    # Always leave the poop arm parked/retracted when this macro finishes.
    POOP_RETRACT
    AFC_ENABLE_SKEW
    SET_VELOCITY_LIMIT ACCEL={backup_accel}
    RESTORE_GCODE_STATE NAME=_ZERO_G_BLOB_MACRO MOVE={1 if restore_position else 0} MOVE_SPEED={travel_speed}



[gcode_macro POOP_RETRACT_DANCE]
description: Retract poop arm + wide dance starting earlier to shake blob into chute
# ---------------- TUNABLES ----------------
variable_end: 180            # final parked retract angle
variable_start: 80          # where the dance starts (earlier). try 120–150
variable_low: 30             # lowest swing angle (must be collision-safe)
variable_high: 180           # high swing angle (below end is fine)
variable_cycles: 3           # number of dance cycles (1–3)
variable_delay: 60           # ms between moves (60–120)
variable_relax: 1            # 1=WIDTH=0 at end, 0=hold position
gcode:
    {% set m = printer["gcode_macro POOP_RETRACT_DANCE"] %}
    {% set end = m.end|int %}
    {% set start = m.start|int %}
    {% set low = m.low|int %}
    {% set high = m.high|int %}
    {% set cycles = m.cycles|int %}
    {% set delay = m.delay|int %}
    {% set relax = m.relax|int %}

    # ---- safety clamps ----
    {% if cycles < 1 %}{% set cycles = 1 %}{% endif %}
    {% if low < 0 %}{% set low = 0 %}{% endif %}
    {% if high > end %}{% set high = end %}{% endif %}
    {% if start > end %}{% set start = end %}{% endif %}
    {% if low >= high %}{% set low = high - 10 %}{% endif %}

    # 1) Move to an earlier "start" position near chute
    SET_SERVO SERVO=poop_arm ANGLE={start}
    G4 P{delay}

    # 2) Wide dance (low <-> high) to break adhesion and drop blob
    {% for i in range(cycles) %}
        SET_SERVO SERVO=poop_arm ANGLE={high}
        G4 P{delay}
        SET_SERVO SERVO=poop_arm ANGLE={low}
        G4 P{delay}
        SET_SERVO SERVO=poop_arm ANGLE={high}
        G4 P{delay}
    {% endfor %}

    # 3) Finish fully retracted
    SET_SERVO SERVO=poop_arm ANGLE={end}
    G4 P150

    {% if relax == 1 %}
        SET_SERVO SERVO=poop_arm WIDTH=0
    {% endif %}

    M117 🔵 Poop Arm Retracted (Wide Dance)
    M117 🔵 Poop Arm Retracted (Dance)