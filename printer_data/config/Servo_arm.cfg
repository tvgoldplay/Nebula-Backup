#######################################################################
# SERVO ARM CONFIGURATION  (Interal Use)
#######################################################################
[servo poop_arm]
pin: PG12
maximum_servo_angle: 180
minimum_pulse_width: 0.0010    # extend deploy side (0°)
maximum_pulse_width: 0.0025    # retract side (180°)
initial_angle: 2               # start retracted

[delayed_gcode INIT_POOP_SERVO]
initial_duration: 1
gcode:
    M117 🟡 Initializing Poop Arm
    SET_SERVO SERVO=poop_arm ANGLE=0
    G4 P500
    SET_SERVO SERVO=poop_arm WIDTH=0
    M117 🔵 Poop Arm Ready



[gcode_macro POOP_DEPLOY]
description: Deploy poop arm to catch purge
gcode:
    SET_SERVO SERVO=poop_arm ANGLE=2
    M117 🟢 Poop Arm Deployed

[gcode_macro POOP_RETRACT]
description: Retract poop arm
gcode:
    SET_SERVO SERVO=poop_arm ANGLE=180
    G4 P200
    SET_SERVO SERVO=poop_arm WIDTH=0
    M117 🔵 Poop Arm Retracted

[gcode_macro Purge]
description: Extrude into the purge bucket
variable_purge_length: 60
variable_purge_length_minimum: 30
gcode:



    SAVE_GCODE_STATE NAME=Purge_state
    {% if params.FV %} # ======= PARAM PURGE LENGTH ==============================
      {action_respond_info("PURGE: param PURGE_LENGTH provided")}
      {% set purge_len = params.FV|float %}
    
    {% else %} # ========================= USE CONFIG VARIABLE =============================
      {action_respond_info("PURGE: No toolmap or PURGE_LENGTH. Using default")}
      {% set purge_len = purge_length|float %}
    {% endif %}

    {% set purge_len = [purge_len,purge_length_minimum]|max %}
    {action_respond_info("PURGE: Purging %.2fmm of filament" % (purge_len|float))}
    {% set FE = params.new_filament_e_feedrate|default(240)|float %}
    
    purge_servo_OUT
    M106 S0
    G92 E0
    G1 E{purge_len} F{FE}
    G92 E0
    G1 E -0.4 F2000
    G92 E0
    M106 S255
    G4 P4000
    purge_servo_IN
    G4 P6000
    purge_servo_OUT
    M106 S0
    RESTORE_GCODE_STATE NAME=Purge_state


[gcode_macro purge_servo_IN]
gcode:
  SET_SERVO SERVO=purge_servo ANGLE=180

[gcode_macro purge_servo_OUT]
gcode:
  SET_SERVO SERVO=purge_servo ANGLE=0

[servo purge_servo]
pin: PG12
maximum_servo_angle: 180
maximum_pulse_width: 0.0015
minimum_pulse_width: 0.0025

Orca Slicer filament change G-code:
{if layer_num >=0}
Lift_and_Go_to_Purge Z_LIFT=1.0
M106 S0
T{next_extruder}
PURGE FV={flush_length}
M106 S0
Wipe_Nozzle
Move_Back_to_Print X={x_after_toolchange} Y={y_after_toolchange} Z={z_after_toolchange}
{endif}